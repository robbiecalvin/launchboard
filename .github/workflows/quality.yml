name: Quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:prepare
        env:
          RAILS_ENV: test
      - run: bin/rails test
        env:
          RAILS_ENV: test
      - run: bundle exec brakeman -q
